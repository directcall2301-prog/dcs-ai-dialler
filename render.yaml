services:
  - type: web
    name: dcs-ai-dialler
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: dcs-dialler-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DCS_MODE
        value: simulation
      - key: DCS_COOKIE_SECURE
        value: "true"
      - key: DCS_DATABASE_PATH
        value: /var/data/dcs_dialler.sqlite3
      - key: DCS_SECRET_KEY
        generateValue: true
      - key: DCS_ADMIN_USERNAME
        value: admin
      - key: DCS_ADMIN_PASSWORD
        sync: false
